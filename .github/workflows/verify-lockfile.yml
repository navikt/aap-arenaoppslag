# Feiler når .github/workflows/actions.lock ikke stemmer med workflowene,
# eller når en låst pin ikke lenger kan verifiseres oppstrøms.

name: verify-lockfile

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.0
      - run: gh actions-lock --verify
